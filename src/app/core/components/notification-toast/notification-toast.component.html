<section class="toast-card" [attr.data-variant]="data.variant" role="status" aria-live="polite">
  <button type="button" class="toast-close" aria-label="Cerrar" (click)="close()">
    x
  </button>

  <div class="toast-icon" [style.color]="iconColor" aria-hidden="true">
    @if (data.variant === 'success') {
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    } @else if (data.variant === 'error') {
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 16v-4"></path>
        <path d="M12 8h.01"></path>
      </svg>
    }
  </div>

  <h4 class="toast-title">{{ data.title }}</h4>
  <p class="toast-message">{{ data.message }}</p>

  <button type="button" class="toast-action" (click)="close()">
    {{ data.actionLabel || 'Cerrar' }}
  </button>
</section>
