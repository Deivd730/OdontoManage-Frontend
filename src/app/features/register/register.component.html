<div class="login-container">
  <div class="login-card">
    <h1 class="brand-name">OdontoManage</h1>
    <p class="subtitle">Crea el teu compte professional</p>

    @if (errorMessage) {
      <div class="minimal-alert">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" formControlName="name" placeholder="Ex.: Joan Pérez"
               [class.input-error]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
      </div>

      <div class="form-group">
        <label>Correu electrònic</label>
        <input type="email" formControlName="email" placeholder="joan@exemple.com"
               [class.input-error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      </div>

      <div class="form-group">
        <label>Contrasenya</label>
        <input type="password" formControlName="password" placeholder="Mínim 6 caràcters"
               [class.input-error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      </div>

      <div class="form-group">
        <label>Confirma la contrasenya</label>
        <input type="password" formControlName="confirmPassword" placeholder="Torna a escriure la contrasenya"
               [class.input-error]="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
        @if (registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched) {
          <small class="error-text">Les contrasenyes no coincideixen</small>
        }
      </div>

      <button type="submit" class="btn-minimal" [disabled]="registerForm.invalid || loading">
        @if (loading) {
          <span class="dot-loader"></span>
        } @else {
          Crea el teu compte
        }
      </button>
    </form>

    <div class="login-footer">
      <div class="register-section">
        Ja tens un compte?
        <a routerLink="/login" class="main-link">Inicia sessió aquí</a>
      </div>
    </div>
  </div>
</div>
