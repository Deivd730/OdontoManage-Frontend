<div class="document-container">
  <div class="document-card">
    <div class="document-header">
      <h1>Afegeix document</h1>
      <p>1 Selecciona un pacient 2 Puja el document</p>
    </div>

    <form [formGroup]="documentForm" (ngSubmit)="submit()" class="document-form">
      <label>
        Pacient
        <select formControlName="patientId" [class.input-error]="isFieldInvalid('patientId')">
          <option [ngValue]="null">Selecciona un pacient</option>
          @for (patient of patients(); track patient.id) {
            <option [value]="patient.id">
              {{ patient.firstName }} {{ patient.lastName }} - DNI {{ patient.nationalId }}
            </option>
          }
        </select>
        @if (hasError('patientId', 'required')) {
          <span class="error">Has de seleccionar un pacient</span>
        }
      </label>

      <label>
        Nom del document
        <input
          type="text"
          formControlName="name"
          placeholder="Ex.: Radiografia dental frontal, Consentiment operatori"
          [class.input-error]="isFieldInvalid('name')"
        />
        @if (hasError('name', 'required')) {
          <span class="error">El nom es obligatori</span>
        }
      </label>

      <label>
        Tipus de document
        <select formControlName="type" [class.input-error]="isFieldInvalid('type')">
          <option [ngValue]="">Selecciona un tipus</option>
          <option value="Radiografía">Radiografia</option>
          <option value="Informe">Informe</option>
          <option value="Consentimiento">Consentiment</option>
          <option value="Prescripción">Prescripcio</option>
          <option value="Fotografía">Fotografia</option>
          <option value="Otro">Altre</option>
        </select>
        @if (hasError('type', 'required')) {
          <span class="error">El tipus es obligatori</span>
        }
      </label>

      <label>
        Data de captura
        <input type="date" formControlName="captureDate" [class.input-error]="isFieldInvalid('captureDate')" />
        @if (hasError('captureDate', 'required')) {
          <span class="error">La data es obligatoria</span>
        }
      </label>

      <label>
        Fitxer
        <input type="file" accept=".pdf,image/*" (change)="onFileSelected($event)" />
        @if (selectedFileName()) {
          <span class="file-name">{{ selectedFileName() }}</span>
        }
        @if (hasError('documentFile', 'required')) {
          <span class="error">Has d'adjuntar un fitxer</span>
        }
      </label>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="cancel()">Cancel·la</button>
        <button type="submit" class="btn primary" [disabled]="isLoading()">
          @if (isLoading()) {
            Pujant...
          } @else {
            Desa document
          }
        </button>
      </div>
    </form>
  </div>
</div>
