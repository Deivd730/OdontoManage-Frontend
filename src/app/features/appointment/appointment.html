<div class="appointment-calendar-container-side">
  <section class="calendar-wrapper-side">
    <app-calendario></app-calendario>
  </section>

  <aside class="day-panel open">
    <app-agenda
      (newAppointmentRequested)="onNewAppointmentRequested()"
      (editAppointmentRequested)="onEditAppointmentRequested($event)"
      (deleteAppointmentRequested)="onDeleteAppointmentRequested($event)"></app-agenda>
  </aside>
</div>

@if (isEditorOpen) {
  <app-appointment-editor
    [mode]="editorMode"
    [selectedDate]="store.selectedDate()"
    [initialValue]="editorInitialValue"
    [isSaving]="store.isSaving()"
    [alert]="store.editorAlert()"
    [patientOptions]="store.patientOptions()"
    [dentistOptions]="store.dentistOptions()"
    [boxOptions]="store.boxOptions()"
    [treatmentOptions]="store.treatmentOptions()"
    (closeRequested)="onEditorClose()"
    (selectionChanged)="onEditorSelectionChanged($event)"
    (saveRequested)="onEditorSave($event)"></app-appointment-editor>
}

@if (isDeleteConfirmOpen) {
  <div class="modal-backdrop" (click)="onDeleteModalClose()">
    <section class="modal-card" role="dialog" aria-modal="true" aria-label="Confirma eliminacio de cita" (click)="$event.stopPropagation()">
      <h3 class="modal-title">Confirma eliminacio</h3>
      <p class="modal-text">
        Estas a punt d'eliminar aquesta cita. Aquesta accio no es pot desfer.
      </p>
      <div class="modal-actions">
        <button class="btn ghost" type="button" (click)="onDeleteModalClose()" [disabled]="store.isSaving()">
          Cancel·la
        </button>
        <button class="btn danger" type="button" (click)="onDeleteConfirm()" [disabled]="store.isSaving()">
          Elimina definitivament
        </button>
      </div>
    </section>
  </div>
}

@if (isBoxAdjustedModalOpen) {
  <div class="modal-backdrop" (click)="onBoxAdjustedModalClose()">
    <section class="modal-card" role="dialog" aria-modal="true" aria-label="Ajust de box" (click)="$event.stopPropagation()">
      <h3 class="modal-title">Ajust de box</h3>
      <p class="modal-text">{{ boxAdjustedMessage }}</p>
      <div class="modal-actions">
        <button class="btn primary" type="button" (click)="onBoxAdjustedModalClose()">Entes</button>
      </div>
    </section>
  </div>
}
