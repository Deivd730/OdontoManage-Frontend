<div class="login-container">
  <div class="login-card">
    <header class="login-header">
      <h1 class="brand-name">OdontoManage</h1>
      <p class="subtitle">Benvingut/benvinguda de nou!</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      @if (errorMessage()) {
        <div class="minimal-alert">
          {{ errorMessage() }}
        </div>
      }

      <div class="form-group">
        <label for="email">Correu electrònic</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.input-error]="isFieldInvalid('email')"
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contrasenya</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.input-error]="isFieldInvalid('password')"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="btn-minimal" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="dot-loader"></span>
        } @else {
          Iniciar sessió
        }
      </button>
    </form>

    <footer class="login-footer">
      <div class="register-section">
        <span>Encara no tens compte?</span>
        <a href="/register" class="main-link">Crea un compte</a>
      </div>
    </footer>
  </div>
</div>
