<div class="dashboard-wrapper">
    <main class="dashboard-main">
        <div class="grid-container">

            <!-- Tarjeta de Perfil -->
            <section class="card-minimal info-section">
                <h2 class="card-title">Tu Perfil</h2>
                <div class="user-profile-brief">
                    <div class="avatar-placeholder">Username</div>
                    <!-- <div class="avatar-placeholder">{{ username?.charAt(0) }}</div> -->
                    <div class="profile-details">
                        <!-- <p class="user-name">{{ username }}</p> -->
                        <p class="user-name">Username</p>
                        <!-- <div class="roles-container">
                            @for (role of roles; track role) {
                            <span class="role-tag">{{ role }}</span>
                            }
                        </div> -->
                    </div>
                </div>
            </section>

            <!-- Panel de Acciones -->
            <section class="card-minimal actions-section">
                <h2 class="card-title">Gestión</h2>
                <div class="actions-grid">
                    <button class="action-card">
                        <!-- <button class="action-card" (click)="navigateTo('/patients')"> -->
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <span>Pacientes</span>
                    </button>

                    <button class="action-card">
                        <!-- <button class="action-card" (click)="navigateTo('/appointments')"> -->
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span>Citas</span>
                    </button>
                    <button class="action-card">
                        <!-- <button class="action-card" (click)="navigateTo('/profile')"> -->
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <span>Mi Perfil</span>
                    </button>
                </div>
            </section>

        </div>
    </main>
</div>
