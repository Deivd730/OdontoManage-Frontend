<div class="dashboard-wrapper">
    <main class="dashboard-main">
        <div class="grid-container">
            <!-- Tarjeta de Perfil -->
            <section class="card-minimal info-section">
                <h2 class="card-title">Perfil</h2>
                <div class="user-profile-brief">
                    <div class="profile-details">
                        @if (authService.currentUser(); as user) {
                        <div class="profile-content">
                            <button class="avatar-placeholder" (click)="goToProfile()" type="button">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                            </button>
                            <p class="user-role-badge">{{ getUserRole() }}</p>
                            <p class="user-info-name">{{ user.name }}</p>
                            <p class="user-info-email">{{ user.email }}</p>
                        </div>
                        } @else {
                        <p>NoName</p>
                        }
                        <div class="roles-container">

                        </div>
                    </div>
                </div>
            </section>
            <!-- Panel de Acciones -->
            <section class="card-minimal actions-section">
                <h2 class="card-title">Gestió</h2>
                <div class="actions-grid">
                    <button class="action-card" (click)="navigateTo('/patients')">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <span>Pacients</span>
                    </button>

                    <button class="action-card" (click)="navigateTo('/appointments')">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span>Cites</span>
                    </button>

                    <button class="action-card" (click)="navigateTo('/documents')">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>
                        <span>Documents</span>
                    </button>

                    <button class="action-card" (click)="navigateTo('/odontogram')">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" aria-hidden="true" class="nav-icon">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M12 2c-3.314 0 -6 2.761 -6 6.167c0 2.443 1.37 4.55 3.35 5.543L10 20a2 2 0 0 0 4 0l.65 -6.29c1.98 -.993 3.35 -3.1 3.35 -5.543C18 4.761 15.314 2 12 2z"></path>
                            </svg>
                        </div>
                        <span>Odontogrames</span>
                    </button>
                </div>
            </section>

        </div>
    </main>
</div>
